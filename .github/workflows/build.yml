name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --no-cache-dir buildozer==1.5.0
          # نسخه دقیق Cython که مشکل کامپایل را حل می‌کند
          pip install --no-cache-dir cython==0.29.34

      - name: Set up Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p tools
          mv cmdline-tools/* tools/ || true
          rm -rf cmdline-tools commandlinetools-linux-9477386_latest.zip
          
          mkdir -p licenses
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > licenses/android-sdk-preview-license

      - name: Build APK
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== ❌ BUILD FAILED ==="
            echo "=== HERE IS THE EXACT ERROR (LAST 50 LINES) ==="
            tail -n 50 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LBank-Scanner-APK
          path: bin/*.apk
