name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --no-cache-dir buildozer
          pip install --no-cache-dir "cython<3.0"

      - name: Build APK
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=================================================="
            echo "=== ❌ BUILD FAILED - EXACT ERROR BELOW ==="
            echo "=================================================="
            # این خط دقیقاً خطای اصلی رو پیدا و چاپ می‌کنه
            grep -i -B 2 -A 5 "Command failed" build.log | tail -n 30
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LBank-Scanner-APK
          path: bin/*.apk
