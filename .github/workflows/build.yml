name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev libexpat1-dev
          pip install --no-cache-dir buildozer==1.5.0
          # نسخه دقیق Cython که با Kivy 2.3.0 و پایتون 3.10 سازگار است
          pip install --no-cache-dir cython==0.29.36

      - name: Pre-install Android SDK & Build Tools
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p tools
          mv cmdline-tools/* tools/
          rm -rf cmdline-tools commandlinetools-linux-9477386_latest.zip
          
          yes | tools/bin/sdkmanager --licenses || true
          tools/bin/sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools" || true

      - name: Build APK
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a
          set +e
          buildozer -v android debug > build.log 2>&1
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "### ❌ بیلد با خطا مواجه شد" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -i -E "error|failed|exception|aidl|modulenotfound" build.log | tail -n 30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LBank-Scanner-APK
          path: bin/*.apk
